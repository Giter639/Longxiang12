name: CI

# 触发：所有 PR + main 分支的 push（合并后兜底验证）+ 手动运行
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle，后续构建大幅提速
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + Unit Tests (41 acceptance anchors)
        run: |
          chmod +x FocusDu/gradlew
          cd FocusDu
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: FocusDu/app/build/reports/tests/
          if-no-files-found: ignore
